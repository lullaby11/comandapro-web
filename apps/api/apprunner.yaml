version: 1
runtime: NODEJS_20

build:
  commands:
    build:
      - npm ci
      - npx prisma generate
      - npm run build

run:
  command: sh -c "npx prisma migrate deploy && node dist/index.js"
  network:
    port: 4000
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    # Orígenes permitidos por CORS, separados por comas. Debe incluir el dominio de la
    # tienda online, que llama a la API entre orígenes distintos.
    # La configuración que manda en producción es la de infra/apprunner.tf (despliegue
    # por imagen ECR); este fichero solo aplica si App Runner construye desde el código.
    - name: ALLOWED_ORIGINS
      value: "https://olyda.app,https://www.olyda.app"
  secrets:
    - name: DATABASE_URL
    - name: JWT_SECRET
    - name: APP_URL
