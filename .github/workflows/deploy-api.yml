name: Deploy API → ECR + App Runner

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/api/prisma/**"
      - ".github/workflows/deploy-api.yml"

env:
  AWS_REGION: eu-west-1

jobs:
  deploy:
    name: Build → Push ECR → Deploy App Runner
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Backup pre-deploy ────────────────────────────────────────────────────
      - name: Create pre-deployment RDS snapshot
        id: snapshot
        env:
          RDS_DB_IDENTIFIER: ${{ secrets.RDS_DB_IDENTIFIER }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          SNAPSHOT_ID="${RDS_DB_IDENTIFIER}-predeploy-${TIMESTAMP}-${SHORT_SHA}"
          echo "Creating snapshot: $SNAPSHOT_ID"
          aws rds create-db-snapshot \
            --db-instance-identifier "$RDS_DB_IDENTIFIER" \
            --db-snapshot-identifier "$SNAPSHOT_ID"
          echo "snapshot_id=$SNAPSHOT_ID" >> $GITHUB_OUTPUT
          echo "Snapshot creation started (runs async — available in ~5 min)"

      - name: Record previous ECR image for rollback
        id: prev_image
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        run: |
          PREV_SHA=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag=latest \
            --query 'imageDetails[0].imageTags' \
            --output json 2>/dev/null \
            | jq -r '.[] | select(. != "latest")' | head -1 || echo "none")
          echo "previous_sha=$PREV_SHA" >> $GITHUB_OUTPUT
          echo "Previous image SHA: $PREV_SHA"

      # ── Build & push ─────────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --cache-from $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -f apps/api/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Trigger App Runner deployment
        env:
          SERVICE_ARN: ${{ secrets.APPRUNNER_SERVICE_ARN }}
        run: |
          aws apprunner start-deployment --service-arn "$SERVICE_ARN"
          echo "Deployment triggered for $SERVICE_ARN"

      - name: Wait for deployment to complete
        env:
          SERVICE_ARN: ${{ secrets.APPRUNNER_SERVICE_ARN }}
        run: |
          echo "Waiting for App Runner to reach RUNNING state..."
          for i in $(seq 1 30); do
            STATUS=$(aws apprunner describe-service \
              --service-arn "$SERVICE_ARN" \
              --query "Service.Status" --output text)
            echo "  Attempt $i/30 — Status: $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then
              echo "Deployment successful!"
              exit 0
            fi
            if [ "$STATUS" = "CREATE_FAILED" ] || [ "$STATUS" = "DELETE_FAILED" ]; then
              echo "Deployment FAILED with status: $STATUS"
              exit 1
            fi
            sleep 10
          done
          echo "Timeout waiting for deployment"
          exit 1

      # ── Summary ──────────────────────────────────────────────────────────────
      - name: Deployment summary
        if: always()
        env:
          SNAPSHOT_ID: ${{ steps.snapshot.outputs.snapshot_id }}
          PREV_SHA:    ${{ steps.prev_image.outputs.previous_sha }}
          NEW_IMAGE:   ${{ steps.build.outputs.image }}
        run: |
          echo "## Deployment summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit desplegado | \`$GITHUB_SHA\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Imagen nueva | \`$NEW_IMAGE\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Snapshot pre-deploy | \`$SNAPSHOT_ID\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA anterior (rollback) | \`$PREV_SHA\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Rollback rápido" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# Revertir aplicación al commit anterior:" >> $GITHUB_STEP_SUMMARY
          echo "./scripts/rollback.sh $PREV_SHA" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Si también necesitas restaurar la BD:" >> $GITHUB_STEP_SUMMARY
          echo "./scripts/rollback.sh $PREV_SHA $SNAPSHOT_ID" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
